name: CI

on:
  push:
    branches: ["main", "claude/**", "feat/**", "fix/**", "arcana/**", "chatgpt/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Next.js needs these at build time even for static export.
          # Use placeholder values — the build only needs them defined,
          # not valid; actual secrets live in Cloudflare environment bindings.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve static export for the a11y/visual check
        # trailingSlash: true in next.config makes every route an
        # index.html under its own directory (e.g. out/account/index.html),
        # which Python's stdlib server already resolves correctly for a
        # directory request -- no extra static-server dependency needed.
        run: |
          python3 -m http.server 4173 --directory out &
          echo $! > /tmp/a11y-server.pid
          for attempt in $(seq 1 20); do
            curl -sf http://127.0.0.1:4173/account/ >/dev/null && exit 0
            sleep 0.5
          done
          echo "static server never became ready" >&2
          exit 1

      - name: Accessibility/visual check (Stage C6)
        run: node scripts/a11y-visual-check.mjs

      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/a11y-server.pid)" 2>/dev/null || true

      - name: Upload a11y screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-visual-check-screenshots
          path: scratch/c6-screens
          retention-days: 14


  db-migrations:
    name: Supabase migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Postgres and apply migrations
        id: supabase-start
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/supabase-db-start.log"
          : > "$log"
          for attempt in 1 2 3 4 5; do
            if supabase db start 2>&1 | tee "$log"; then
              echo "started=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            supabase stop --no-backup >/dev/null 2>&1 || true
            [ "$attempt" -eq 5 ] || sleep $((attempt * 15))
          done

          if grep -Eqi 'toomanyrequests|failed to pull docker image|error pulling image configuration' "$log"; then
            echo "::warning::Supabase registry unavailable; using targeted PostgreSQL fallback for the new migration."
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Supabase local database failed for a non-registry reason." >&2
          exit 1

      - name: Replay migrations from a clean Supabase database
        if: steps.supabase-start.outputs.started == 'true'
        run: supabase db reset

      - name: Validate admin migration without Docker when registry is throttled
        if: steps.supabase-start.outputs.started == 'false'
        run: bash scripts/test-admin-ops-migration.sh

      - name: Validate invite identity guard semantics in PostgreSQL
        run: bash scripts/test-invite-identity-guard.sh

      - name: Validate fleet foundations migration semantics in PostgreSQL
        run: bash scripts/test-fleet-foundations-migration.sh

      - name: Validate node enrollment migration semantics in PostgreSQL
        run: bash scripts/test-node-enrollment-migration.sh

      - name: Validate route directory migration semantics in PostgreSQL
        run: bash scripts/test-route-directory-migration.sh
